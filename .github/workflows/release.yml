name: Publisher release builds

# Gera os instaladores de cada sistema em máquinas nativas e os anexa a um rascunho de
# release deste repositório; a release pública é criada no repositório de distribuição.
# Anexos de release não contam na cota de artefatos do Actions, que os instaladores de
# três versões esgotavam.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.create.outputs.tag }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_id }}
        run: |
          gh release create "$TAG" --draft -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Build $GITHUB_RUN_ID ($GITHUB_SHA)" \
            --notes "Instaladores gerados pelo workflow; a release pública fica no KMP-releases."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux AppImage
            files: release/*.AppImage
          - os: windows-latest
            target: --win nsis
            files: release/*.exe
          - os: macos-latest
            # Arquiteturas explícitas: só "--mac dmg" gera apenas a da máquina (arm64).
            target: --mac dmg --x64 --arm64
            files: release/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      # Sem certificado de assinatura: o build não deve tentar procurar um no chaveiro.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --publish never ${{ matrix.target }}
      - name: Anexar os instaladores ao rascunho
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.draft.outputs.tag }}" ${{ matrix.files }} --clobber -R "$GITHUB_REPOSITORY"
